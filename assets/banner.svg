<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    <![CDATA[
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .gradient-text {
      fill: url(#accentGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-weight: 700;
      font-size: 20px;
      fill: #38bdf8;
    }

    /* Subtle pulsing and floating dynamic animations in the background */
    @keyframes floatLight {
      0% { transform: translateY(0px) scale(1); opacity: 0.35; }
      50% { transform: translateY(-15px) scale(1.08); opacity: 0.65; }
      100% { transform: translateY(0px) scale(1); opacity: 0.35; }
    }
    @keyframes pulseOrb {
      0% { transform: scale(0.95); opacity: 0.2; }
      50% { transform: scale(1.15); opacity: 0.45; }
      100% { transform: scale(0.95); opacity: 0.2; }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 200; }
    }

    .pulse-glow-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-glow-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .dynamic-line {
      stroke-dasharray: 8 6;
      animation: waveFlow 12s linear infinite;
    }
    .float-card {
      animation: floatLight 6s ease-in-out infinite;
    }
    ]]>
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Aura Orbs (strictly background) -->
  <g>
    <circle class="pulse-glow-1" cx="200" cy="120" r="180" fill="#38bdf8" filter="url(#glow)" opacity="0.18" />
    <circle class="pulse-glow-2" cx="1020" cy="300" r="210" fill="#818cf8" filter="url(#glow)" opacity="0.18" />
    <circle class="pulse-glow-1" cx="620" cy="50" r="140" fill="#c084fc" filter="url(#glow)" opacity="0.12" />
  </g>

  <!-- High-Tech Grid and Dynamic Connection Lines (strictly background) -->
  <g opacity="0.15">
    <line x1="60" y1="0" x2="60" y2="420" stroke="#38bdf8" stroke-width="1" />
    <line x1="1140" y1="0" x2="1140" y2="420" stroke="#818cf8" stroke-width="1" />
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#818cf8" stroke-width="1" />
    <!-- Dynamic animated flowing connector -->
    <path class="dynamic-line" d="M 80 340 Q 300 370 600 340 T 1120 340" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Foreground Content: Header, Title, Subtitle (Guaranteed 100% Clear & Legible) -->
  <g transform="translate(80, 85)">
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect width="270" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="30" y="20" class="badge-text" fill="#38bdf8">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title">
      Awesome <tspan class="gradient-text">Text Editors &amp; IDEs</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="118" class="subtitle">
      AI-Native Code Editors • Cloud &amp; Web IDEs • Modal Terminals • GPU-Accelerated Workspaces
    </text>
  </g>

  <!-- Feature Cards / Metric Pills in Lower Half (Foreground) -->
  <g transform="translate(80, 245)">
    <!-- Card 1: AI Code Editors -->
    <g transform="translate(0, 0)">
      <rect width="245" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.2" />
      <text x="31" y="44" font-size="18">🤖</text>
      <text x="68" y="36" class="stat-label">Category</text>
      <text x="68" y="58" class="stat-val" font-size="17">AI-Native IDEs</text>
      <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">Cursor, Windsurf, Copilot, Cline</text>
    </g>

    <!-- Card 2: Cloud & Web IDEs -->
    <g transform="translate(265, 0)">
      <rect width="245" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#4f46e5" fill-opacity="0.2" />
      <text x="31" y="44" font-size="18">☁️</text>
      <text x="68" y="36" class="stat-label">Infrastructure</text>
      <text x="68" y="58" class="stat-val" font-size="17" fill="#818cf8">Cloud &amp; CDEs</text>
      <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">Codespaces, Daytona, Coder, Gitpod</text>
    </g>

    <!-- Card 3: Terminal & Modal -->
    <g transform="translate(530, 0)">
      <rect width="245" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#9333ea" fill-opacity="0.2" />
      <text x="31" y="44" font-size="18">⚡</text>
      <text x="68" y="36" class="stat-label">Performance</text>
      <text x="68" y="58" class="stat-val" font-size="17" fill="#c084fc">High Speed &amp; Modal</text>
      <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">Neovim, Zed (GPUI), Helix, Lapce</text>
    </g>

    <!-- Card 4: Open Source Stars -->
    <g transform="translate(795, 0)">
      <rect width="245" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#059669" fill-opacity="0.2" />
      <text x="31" y="44" font-size="18">🌟</text>
      <text x="68" y="36" class="stat-label">Ecosystem</text>
      <text x="68" y="58" class="stat-val" font-size="17" fill="#34d399">1M+ Total Stars</text>
      <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">Open-Source Core &amp; Toolchains</text>
    </g>
  </g>
</svg>